upstream agecalc_app {
  server unix:/run/agecalc/agecalc.sock;
  keepalive 16;
}

# Query strings may contain legacy calculator inputs. Keep access logs path-only.
log_format agecalc_path_only '$remote_addr - $remote_user [$time_local] '
  '"$request_method $uri $server_protocol" $status $body_bytes_sent '
  '"$http_user_agent"';

# Gunicorn worker와 무관하게 초안 로그인 요청을 IP별로 제한합니다.
limit_req_zone $binary_remote_addr zone=agecalc_blog_login:10m rate=5r/m;

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name agecalc.cloud;
  access_log /var/log/nginx/agecalc_access.log agecalc_path_only;

  ssl_certificate /etc/letsencrypt/live/agecalc.cloud/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/agecalc.cloud/privkey.pem;

  location / {
    proxy_pass http://agecalc_app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /blog/drafts {
    limit_req zone=agecalc_blog_login burst=3 nodelay;
    proxy_pass http://agecalc_app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 정적 리소스 gzip 압축
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  gzip_comp_level 5;

  # 정적 리소스 캐시 (30일)
  location /static/ {
      alias /srv/apps/agecalc/static/;
      add_header Cache-Control "public, max-age=2592000";
      try_files $uri $uri/ =404;
  }

  location = /favicon.ico {
    alias /srv/apps/agecalc/favicon.ico;
    default_type image/x-icon;
    access_log off;
    log_not_found off;
  }

  location = /apple-touch-icon.png {
    alias /srv/apps/agecalc/static/images/apple-touch-icon.png;
    default_type image/png;
    access_log off;
    log_not_found off;
  }

  location /health {
    proxy_pass http://agecalc_app;
  }

  location = /robots.txt {
    alias /srv/apps/agecalc/static/robots.txt;
    default_type text/plain;
  }

  location = /sitemap.xml {
    proxy_pass http://agecalc_app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /ads.txt {
    alias /srv/apps/agecalc/static/ads.txt;
    default_type text/plain;
  }

}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name www.agecalc.cloud;
  access_log /var/log/nginx/agecalc_access.log agecalc_path_only;

  ssl_certificate /etc/letsencrypt/live/agecalc.cloud/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/agecalc.cloud/privkey.pem;

  return 301 https://agecalc.cloud$uri;
}

# HTTP 요청은 HTTPS로 리다이렉트
server {
  listen 80;
  listen [::]:80;
  server_name agecalc.cloud www.agecalc.cloud;
  access_log /var/log/nginx/agecalc_access.log agecalc_path_only;
  return 301 https://agecalc.cloud$uri;
}
