{% if coupang_partners_enabled and coupang_event_promotions %}
<aside class="info-coupang-promotions" aria-label="쿠팡 파트너스 이벤트 프로모션">
    <div class="info-coupang-promo-grid">
        {% for promotion in coupang_event_promotions %}
        <a class="info-coupang-promo" href="{{ promotion.url }}" target="_blank" rel="sponsored nofollow noopener" referrerpolicy="unsafe-url">
            <img src="{{ promotion.image_url }}" alt="{{ promotion.alt }}" width="{{ promotion.width }}" height="{{ promotion.height }}" loading="lazy">
        </a>
        {% endfor %}
    </div>
    <p class="coupang-disclosure">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
</aside>
{% endif %}
